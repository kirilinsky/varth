name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # floor we support: native TS config stripping needs >= 22.18
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run knip # dead code / unused deps / unused exports
      - run: npm run test:coverage
      - run: npm run build
      - run: npx publint # publish config sanity: bin paths, files field
      - name: Smoke the CLI end-to-end
        run: |
          dir="$(mktemp -d)"
          cd "$dir"
          node "$GITHUB_WORKSPACE/bin/varth.mjs" init
          node "$GITHUB_WORKSPACE/bin/varth.mjs" gen
          test -f varth.css && test -f varth.js && test -f varth.d.ts
          grep -q "light-dark(" varth.css
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
